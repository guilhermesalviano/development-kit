# Hyprland — estilo Omarchy (Tokyo Night) para Debian.
# Instalado por: ./toolbox hypr-desktop configs
# Edite aqui no repositório e rode o comando de novo para aplicar.

# ---------------------------------------------------------------- monitores
# "preferred, auto, 1": resolução nativa, posição automática, escala 1.
# Para HiDPI troque o último valor (ex.: 1.5 ou 2).
monitor = , preferred, auto, 1

# ---------------------------------------------------------------- programas
$terminal    = alacritty
$menu        = fuzzel
$fileManager = nautilus --new-window
$browser     = sh -c 'gtk-launch "$(xdg-settings get default-web-browser)"'
$scripts     = ~/.config/hypr/scripts

# ---------------------------------------------------------------- ambiente
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ---------------------------------------------------------------- autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprpolkitagent
exec-once = $scripts/wallpaper.sh
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = swayosd-server
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ---------------------------------------------------------------- aparência
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, easeOut, popin 80%
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 4, easeOut, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

ecosystem {
    no_update_news = true
}

# ---------------------------------------------------------------- entrada
input {
    kb_layout = us
    follow_mouse = 1
    repeat_rate = 40
    repeat_delay = 250
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace

# ---------------------------------------------------------------- atalhos
# Super (tecla Command no teclado Apple).
$mod = SUPER

bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $fileManager
bind = $mod, ESCAPE, exec, $scripts/power-menu.sh
bind = $mod CTRL, L, exec, loginctl lock-session

bind = $mod, W, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating,

# Foco e movimento com as setas
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Áreas de trabalho
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1

# Mover / redimensionar com o mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Capturas de tela (vão para a área de transferência e ~/Pictures/Screenshots)
bind = , PRINT, exec, $scripts/screenshot.sh region
bind = SHIFT, PRINT, exec, $scripts/screenshot.sh full

# Teclas de mídia
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
